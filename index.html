<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8d5b98">
    <title>Dhiviyan R & Meenaloshini S — Wedding Invitation</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<main id="wedding">

    <!-- Atmospheric background -->
    <div id="background"></div>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div id="light"></div>
    <div id="bokeh"></div>

    <!-- Animated botanical garden -->
    <div id="garden" aria-hidden="true"></div>
    <div id="wisteria-layer" aria-hidden="true"></div>
    <div id="leaf-layer" aria-hidden="true"></div>
    <div id="flower-layer" aria-hidden="true"></div>
    <div id="stem-layer" aria-hidden="true"></div>
    <div id="butterfly-layer" aria-hidden="true"></div>
    <div id="petal-layer" aria-hidden="true"></div>

    <!-- Real 3D invitation -->
    <section class="book" aria-label="Wedding invitation">
        <div id="pages"></div>
    </section>

    <!-- Navigation -->
    <button class="nav-button nav-left" id="prevButton" aria-label="Previous page">‹</button>
    <button class="nav-button nav-right" id="nextButton" aria-label="Next page">›</button>

    <div class="page-indicator" id="pageIndicator"></div>

    <!-- Controls -->
    <div class="controls">
        <button id="musicButton" title="Music" aria-label="Music">♫</button>
        <button id="autoButton" title="Auto page turn" aria-label="Auto page turn">AUTO</button>
        <button id="fullscreenButton" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    </div>

    <div class="swipe-hint">SWIPE OR USE THE ARROWS</div>

    <audio id="weddingMusic" loop preload="none"></audio>
</main>

<script src="js/app.js"></script>
</body>
</html>
