<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dhiviyan R & Meenaloshini S</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="wedding">
  <div id="background"></div>
  <div id="sunGlow"></div>
  <div id="air"></div>
  <div id="bokeh"></div>
  <div id="garden"></div>
  <div id="petals"></div>
  <div id="butterflies"></div>

  <section class="book" aria-label="Wedding invitation">
    <div id="pages"></div>
  </section>

  <button class="nav nav-left" id="prev" aria-label="Previous">‹</button>
  <button class="nav nav-right" id="next" aria-label="Next">›</button>
  <div class="controls">
    <button id="music" aria-label="Music">♫</button>
    <button id="auto" aria-label="Auto">AUTO</button>
    <button id="full" aria-label="Fullscreen">⛶</button>
  </div>
  <div id="dots" class="dots"></div>
  <div class="hint">SWIPE OR USE THE ARROWS</div>
  <audio id="audio" loop preload="none"></audio>
</main>
<script src="js/app.js"></script>
</body>
</html>
