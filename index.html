<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dhiviyan R & Meenaloshini S
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main id="wedding">

        <!-- Background -->
        <div id="background"></div>

        <!-- Animated light -->
        <div id="light"></div>

        <!-- Flowers -->
        <div id="flowers"></div>

        <!-- Butterflies -->
        <div id="butterflies"></div>

        <!-- Falling petals -->
        <div id="petals"></div>

        <!-- Invitation -->
        <section id="invitation">

            <div class="ornament">
                ❧ ✦ ❧
            </div>

            <div class="small-title">
                WEDDING INVITATION
            </div>

            <h1>
                Dhiviyan R
                <span>&amp;</span>
                Meenaloshini S
            </h1>

            <div class="date">
                25 · 10 · 2026
            </div>

            <p>
                For the beginning<br>
                of our forever...
            </p>

            <div class="heart">
                ♡
            </div>

        </section>


        <!-- Controls -->

        <div class="controls">

            <button id="musicButton">
                ♫
            </button>

            <button id="autoButton">
                Auto 5s
            </button>

            <button id="fullscreenButton">
                ⛶
            </button>

        </div>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
