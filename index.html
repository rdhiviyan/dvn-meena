<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dhiviyan & Meenaloshini</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- OPENING INVITATION -->
  <main class="opening" id="opening">

    <!-- Temple atmosphere -->
    <div class="temple-bg"></div>

    <div class="gold-glow"></div>

    <!-- Top traditional ornament -->
    <div class="ornament">
      ✦ ❈ ✦
    </div>

    <div class="invitation-content">

      <div class="small-tamil">
        சுபமஸ்து
      </div>

      <div class="ganesha">
        ॐ
      </div>

      <div class="small-text">
        WITH THE BLESSINGS OF OUR FAMILIES
      </div>

      <h1>
        Dhiviyan
        <span>&</span>
        Meenaloshini
      </h1>

      <div class="date">
        25 · 10 · 2026
      </div>

      <button id="openInvitation" class="open-button">
        <span class="button-gold">OPEN INVITATION</span>
        <span class="button-tamil">அழைப்பிதழை திறக்க</span>
      </button>

    </div>

    <!-- Silk curtains -->
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <!-- Silk ribbon -->
    <div class="silk-ribbon">
      <span>✦</span>
    </div>

  </main>


  <script src="js/app.js"></script>

</body>
</html>
